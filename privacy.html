<h1>DS Bot 个人备份隐私权政策</h1>
<h2>访问的数据及用途</h2>
<p>操作者授权本机 rclone 访问自己的 Google Drive。备份任务使用该授权上传备份压缩包、读取备份的文件名、大小和校验值，以及清理过期备份。</p>
<h2>存储和共享</h2>
<p>备份存储在本机和操作者自己的 Google Drive。Google OAuth 授权凭据保存在本机 rclone 配置中。本说明网站不接收备份文件或 OAuth 凭据。此流程不会把备份用于广告或对外分享。</p>
<h2>撤销授权与删除备份</h2>
<p>操作者可以在 <a href="https://myaccount.google.com/connections">Google 账号的第三方连接</a>中撤销授权，并在本机和 Google Drive 中删除各自保存的备份。</p>
